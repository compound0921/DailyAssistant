name: Build unsigned iOS IPA

# 只为拿到可在 Windows 上侧载的未签名 IPA：产物由 Sideloadly 用免费 Apple ID 重签后装到 iPad。
# 不做签名、不上传 TestFlight，也不需要任何 Apple 凭据。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-unsigned.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          echo "name=${version:-0.0.0}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          app=build/ios/iphoneos/Runner.app
          test -d "$app"
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/
          cd dist
          zip -qry "DailyAssistant-${{ steps.version.outputs.name }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: dist/*.ipa
          retention-days: 14
